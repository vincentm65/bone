[package]
name = "bone"
description = "The bone command: headless server today, TUI later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bone-core.workspace = true
bone-lua.workspace = true
bone-proto.workspace = true
bone-server.workspace = true
bone-tui.workspace = true
bone-gui = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc.workspace = true

[build-dependencies]
# The Windows icon resource (build.rs).
embed-resource = "3"

[features]
# The desktop GUI (`bone --gui`) is built in by default; the TUI costs little
# extra. Build TUI-only with `--no-default-features`.
default = ["gui"]
gui = ["dep:bone-gui"]
# Windows: no console window (a desktop program). For the npm package's
# bone-gui.exe, which is only started for the GUI.
windowed = []

[dev-dependencies]
image.workspace = true
bone-media.workspace = true
base64.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "net", "io-util"] }
libc.workspace = true

# The clipboard test's owner; on Linux it uses wl-copy or xclip.
[target.'cfg(any(target_os = "macos", windows))'.dev-dependencies]
arboard = "3.6"
