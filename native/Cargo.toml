[package]
name = "bone-desktop"
version.workspace = true
edition.workspace = true

# The app is a library so the Android crate can embed the same UI.
[lib]
name = "bone_desktop"
path = "src/lib.rs"

[[bin]]
name = "bone-desktop"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bone-client = { path = "../client" }
bone-protocol = { path = "../protocol" }
bone-render = { path = "../render" }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "links", "wgpu"] }
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.29", default-features = false }
unicode-width = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }

[dev-dependencies]

# Desktop-only eframe features; the Android app embeds this crate without them
# (`accesskit` is unavailable with NativeActivity).
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "wayland", "x11"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
