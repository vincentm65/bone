[package]
name = "bone-fake-provider"
description = "A strict stand-in for model APIs (OpenAI Chat Completions and Responses) that answers with a local model or a script, for testing bone's providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64.workspace = true
bytes = "1"
futures-util.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
bone-client.workspace = true
bone-core.workspace = true
bone-proto.workspace = true
bone-server.workspace = true
tempfile.workspace = true
