[package]
name = "bone-render"
version.workspace = true
edition.workspace = true

[lib]
name = "bone_render"
path = "src/lib.rs"

[dependencies]
bone-protocol = { path = "../protocol" }
ratatui = { version = "0.29", default-features = false, features = ["unstable-rendered-line-info"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-onig"] }
pulldown-cmark = "0.13.4"
unicode-width = "0.2"
serde_json = "1"
base64 = "0.22"
png = "0.18"

# `arboard` has no Android clipboard backend, so it is only declared off Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
