[package]
name = "bone-ui"
description = "Frontend-neutral bone client UI state: text, markdown, editing, options, styles, keys, chat transcripts, terminal screens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bitflags.workspace = true
bone-client.workspace = true
bone-lua.workspace = true
bone-media.workspace = true
bone-proto.workspace = true
mlua.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "process", "io-util", "fs"] }
unicode-width.workspace = true
vt100 = "0.15"

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
