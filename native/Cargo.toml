[package]
name = "bone-desktop"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bone-desktop"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
bone-client = { path = "../client" }
bone-protocol = { path = "../protocol" }
eframe = { version = "0.36.1", default-features = true, features = ["wgpu"] }
pulldown-cmark = "0.13"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
