[package]
name = "bone-android"
version.workspace = true
edition.workspace = true
description = "The Bone desktop UI on Android, attached to your computer over SSH"

# `cdylib` is what an Android APK loads; `rlib` lets the desktop preview binary
# and tests link the same code.
[lib]
name = "bone_android"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# Phone-sized desktop window for developing the UI without a device.
[[bin]]
name = "bone-android-preview"
path = "src/main.rs"

[dependencies]
bone-desktop = { path = "../native" }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
russh = { version = "0.63", default-features = false, features = ["ring", "flate2"] }
tokio = { version = "1", features = ["io-util"] }

# NativeActivity glue for the APK; `winit` is named directly for the
# `android_main` signature and matches eframe's version.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["android-native-activity"] }
winit = "0.30"

# APK settings for `cargo apk build -p bone-android --lib`.
[package.metadata.android]
package = "dev.bone.android"
apk_name = "bone"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Bone"
# No title bar. Not `Fullscreen`: Android ignores keyboard resizing for
# full-screen windows, so the status bar stays and the window sits below it.
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
