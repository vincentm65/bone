[package]
name = "bone-gui"
description = "Desktop bone client: a native window on the shared bone-ui state"
version.workspace = true
edition.workspace = true
# gpui needs a recent toolchain; the rest of the workspace keeps its own minimum.
rust-version = "1.95"

[dependencies]
base64.workspace = true
bone-lua.workspace = true
bone-media.workspace = true
bone-proto.workspace = true
bone-ui.workspace = true
gpui = "0.2.2"
image.workspace = true
ttf-parser = "0.25"
mlua.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
notify-rust = "4.18.2"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# The Dock icon of a bare binary (no app bundle), set at start.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"

[dev-dependencies]
bone-core.workspace = true
bone-server.workspace = true
bone-tui.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
