[package]
name = "bone-desktop"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bone-desktop"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bone-client = { path = "../client" }
bone-protocol = { path = "../protocol" }
bone-render = { path = "../render" }
eframe = { version = "0.36.1", default-features = true, features = ["wgpu", "glow"] }
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.29", default-features = false }
unicode-width = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
