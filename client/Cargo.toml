[package]
name = "bone-client"
version.workspace = true
edition.workspace = true

[lib]
name = "bone_client"
path = "src/lib.rs"

[dependencies]
bone-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "macros", "rt", "process", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
