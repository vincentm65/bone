[package]
name = "bone-server"
description = "Hosts bone-core and speaks bone-proto over a transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bone-core.workspace = true
bone-proto.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
bone-lua.workspace = true
bone-client.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "io-util"] }
