[package]
name = "bone-tui"
description = "Fullscreen bone TUI: buffers, windows, modes, keymaps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bone-media.workspace = true
base64.workspace = true
bone-client.workspace = true
bone-proto.workspace = true
crossterm.workspace = true
futures-util.workspace = true
mlua.workspace = true
bone-lua.workspace = true
ratatui.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "process", "io-util", "fs"] }
unicode-width.workspace = true
vt100 = "0.15"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
